[package]
name = "delegate-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server exposing parliamentary speech search and RAG capabilities"

[dependencies]
rmcp = { version = "3.1.3", features = ["server", "transport-streamable-http-server", "macros", "schemars"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
qdrant-client = {version = "1.19.0"}

dataservice = { path = "../dataservice/dataservice", default-features = false, features = ["vectordb", "runner"] }
somai-client = { path = "../dataservice/somai-client" }
dotenv = "0.15.0"
reqwest = {version = "0.13.4", features = ["json"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
clap = { version = "4.5", features = ["derive"] }
sha3 = "0.10"
hex = "0.4"
jsonwebtoken = "9"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
